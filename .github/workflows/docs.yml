name: Publish API documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust API documentation
        run: cargo doc --no-deps --all-features

      - name: Prepare Pages artifact
        run: |
          mkdir -p site

          # 复制 binary_archive crate 文档
          cp -R target/doc/binary_archive/. site/

          # 复制 rustdoc 的 CSS / JS /字体等公共静态资源
          cp -R target/doc/static.files site/static.files

          # 因为 crate 文档从 target/doc/binary_archive/
          # 被提升到了 Pages 根目录，
          # 所以需要修正 rustdoc 生成的静态资源相对路径
          find site -name '*.html' -type f -exec \
            sed -i 's|\\.\\./static\\.files/|static.files/|g' {} +

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
