[package]
name = "binary_archive"
version = "0.2.1"
edition = "2024"
description = "A small, versioned binary serialization and chunk archive library"
license = "MIT"
repository = "https://github.com/ananwanan/binary_archive"
readme = "README.md"
keywords = ["binary", "serialization", "archive", "chunk"]
categories = ["encoding", "data-structures"]
exclude = [
    ".idea/*",
    ".vscode/*",
    "target/*",
    ".github/*",
    "CNAME",
]

[dependencies]
binary_archive_derive = { version = "=0.2.1", path = "binary_archive_derive", optional = true }

[features]
default = []
derive = ["dep:binary_archive_derive"]

[workspace]
members = ["binary_archive_derive"]
resolver = "3"

[[example]]
name = "derive"
required-features = ["derive"]
